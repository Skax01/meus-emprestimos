<style>
:root{--bg:#e9efe4;--tx:#12261f;--mu:#5c7068;--ac:#0f7b5f;--gold:#8a6508;--ok:#16765a;--oks:rgba(31,162,127,.16);--red:#b8382a;--reds:rgba(184,56,42,.13);--soft:rgba(255,255,255,.45);--bd:rgba(20,60,45,.12);--ibd:rgba(20,70,55,.2);--glass:rgba(255,255,255,.5);--glass3:rgba(255,255,255,.62);--glassF:rgba(250,253,247,.97);--edge:rgba(255,255,255,.8);--inp:rgba(255,255,255,.6);--onb:rgba(255,255,255,.85);--trk:rgba(20,70,55,.14);--glsh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25),0 12px 30px rgba(15,80,60,.14);--bgimg:radial-gradient(60% 45% at 88% 6%,rgba(240,205,120,.6),transparent 70%),radial-gradient(55% 50% at 6% 30%,rgba(95,190,150,.45),transparent 70%),radial-gradient(75% 55% at 28% 102%,rgba(60,160,130,.4),transparent 70%),radial-gradient(45% 40% at 100% 72%,rgba(160,200,220,.35),transparent 70%),linear-gradient(180deg,#f3f6ec 0%,#e6efdf 55%,#d6e6d3 100%);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0d1a17;--tx:#e9f2ec;--mu:#9fb5ab;--ac:#4fd1a5;--gold:#f0c862;--ok:#7be0b4;--oks:rgba(79,209,165,.18);--red:#ff9b86;--reds:rgba(255,155,134,.16);--soft:rgba(255,255,255,.07);--bd:rgba(255,255,255,.1);--ibd:rgba(255,255,255,.14);--glass:rgba(22,40,34,.58);--glass3:rgba(16,30,26,.68);--glassF:rgba(20,36,31,.97);--edge:rgba(255,255,255,.14);--inp:rgba(255,255,255,.07);--onb:rgba(255,255,255,.16);--trk:rgba(255,255,255,.12);--glsh:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.4);--bgimg:radial-gradient(60% 45% at 88% 4%,rgba(214,170,70,.28),transparent 70%),radial-gradient(55% 50% at 4% 34%,rgba(40,150,115,.4),transparent 70%),radial-gradient(78% 56% at 32% 102%,rgba(20,110,95,.5),transparent 70%),linear-gradient(180deg,#0d1a17 0%,#0f221d 60%,#12291f 100%);color-scheme:dark}
[hidden]{display:none!important}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:512px;background:transparent;color:var(--tx);font:15.5px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 14px calc(104px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg)}
body.wide{max-width:672px}
.fd{font-family:"Cormorant Garamond",Georgia,serif}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:4px 4px 14px}
.top h1{margin:0;font:600 32px/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mu);margin-top:3px}
.tr{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tg{position:relative;display:flex;align-items:center;justify-content:space-between;width:68px;height:36px;padding:0 9px;border-radius:999px;border:1px solid var(--edge);background:var(--glass3);box-shadow:var(--glsh);cursor:pointer;font-size:14px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tg .tgi{position:relative;z-index:2;line-height:1;opacity:.5}
.tg .thumb{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;z-index:1;background:linear-gradient(180deg,#fff,#ffe0ba);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(150,80,30,.3);transition:transform .4s cubic-bezier(.3,1.4,.5,1),background .3s}
.tg.dk .thumb{transform:translateX(32px);background:linear-gradient(180deg,#5d483b,#2f221b);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 8px rgba(0,0,0,.45)}
.tg:not(.dk) .s,.tg.dk .m{opacity:1}

.glass,.card,.stat,.greet,.sbox div,.mb{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--glsh);-webkit-backdrop-filter:blur(20px) saturate(165%);backdrop-filter:blur(20px) saturate(165%)}
.greet{border-radius:28px;padding:22px 22px 18px;margin-bottom:14px;animation:up .3s ease-out both}
.greet small{display:block;color:var(--mu);font-size:15px;letter-spacing:.02em}
.greet h2{margin:2px 0 8px;font:600 clamp(30px,9vw,42px)/1.05 "Cormorant Garamond",Georgia,serif;letter-spacing:-.01em;overflow-wrap:anywhere}

.sv.ok{background:var(--oks);color:var(--ok)}.sv.sg{background:var(--soft);color:var(--mu)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--reds);color:var(--red);border-radius:12px;padding:10px 12px;font-size:12px}
.alert button{background:none;border:0;color:inherit;font-size:18px;cursor:pointer}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
nav div{max-width:512px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:28px;background:var(--glass3);border:1px solid var(--edge);box-shadow:var(--glsh);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}

nav button i{font-style:normal;font-size:21px;line-height:1}
nav button.on{background:linear-gradient(180deg,var(--onb),rgba(255,255,255,.1));color:var(--ac);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(10,100,75,.2)}
.card{border-radius:20px;padding:16px;margin-bottom:12px;animation:up .25s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fi{animation:up .25s ease-out both}
.ct{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
label.l,.lb{display:block;font-size:12px;font-weight:500;color:var(--mu)}
input,select{display:block;margin-top:4px;width:100%;height:44px;border-radius:14px;border:1px solid var(--ibd);background:var(--inp);color:var(--tx);padding:0 12px;font:inherit;font-size:16px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(31,162,127,.25)}
input:disabled{opacity:.4;cursor:not-allowed}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#138a69,#0a5a4c);color:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 28px rgba(10,90,70,.32)}
.hero:after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:rgba(236,196,92,.3)}
.hero small{opacity:.9}.hero b{display:block;font:600 40px/1.1 "Cormorant Garamond",Georgia,serif}.hero span{font-size:13px;opacity:.95}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;min-height:40px;padding:0 14px;font:600 14px Inter,sans-serif;background:linear-gradient(180deg,#25a882,#0d6b52);color:#fff;border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(10,100,75,.28);text-shadow:0 1px 1px rgba(90,40,10,.3);cursor:pointer;text-decoration:none;gap:6px}
.btn.big{width:100%;min-height:56px;font-size:16px;border-radius:18px}.btn:active{transform:scale(.97)}
.btn.g,.btn.d,.btn.w{background:var(--soft);color:var(--ac);border:1px solid var(--edge);box-shadow:none;text-shadow:none}
.btn.d{background:var(--reds);color:var(--red)}.btn.w{background:var(--oks);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between;align-items:flex-start}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--oks);color:var(--ok);white-space:nowrap}.tag.lt{background:var(--reds);color:var(--red)}.tag.mu{background:var(--soft);color:var(--mu)}.tag.pr{background:rgba(214,170,60,.24);color:var(--gold)}
.note{font-size:12px;color:var(--mu)}b.n,.tn{font-variant-numeric:tabular-nums}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{border-radius:20px;padding:16px 6px 14px;text-align:center;animation:up .25s ease-out both}
.stat b{display:block;font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--ac)}.stat b.sm{font-size:23px;padding-top:6px;color:var(--gold)}.stat span{font-size:12px;color:var(--mu)}
.rc{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;position:relative;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--trk) 0);display:flex;align-items:center;justify-content:center;font:600 24px "Cormorant Garamond",Georgia,serif}
.ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--glassF)}.ring span{position:relative}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}.k3 div{background:var(--soft);border-radius:14px;padding:8px 4px}.k3 p{margin:0;font-size:10px;color:var(--mu)}.k3 b{font-size:14px}
.bar{height:8px;border-radius:6px;background:var(--trk);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e6c25a,#1fa27f);border-radius:6px;transition:width .5s}
ul.l{list-style:none;margin:12px 0 0;padding:0}ul.l li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}ul.l li:first-child{border-top:0}
.pg{height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.38);background:linear-gradient(180deg,#25a882,#0d6b52);color:#fff;font:600 12px Inter,sans-serif;padding:0 16px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px rgba(10,100,75,.25)}.pg:active{transform:scale(.95)}
.ud{height:36px;border:0;background:none;color:var(--ok);font:600 12px Inter,sans-serif;cursor:pointer;padding:0 6px}
.late{color:var(--red)}.mu{color:var(--mu)}
.empty{text-align:center;padding:48px 24px}.empty p{margin:4px 0}.empty .fd{font-size:24px;font-weight:600}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal7 .h{font-size:11px;color:var(--mu);padding:4px 0}
.cal7 button{position:relative;height:44px;border:0;border-radius:14px;background:none;color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.cal7 button.t{background:rgba(31,162,127,.18);color:var(--ac)}.cal7 button.a{background:linear-gradient(180deg,#25a882,#0d6b52);color:#fff}
.cal7 button i{position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ok)}.cal7 button i.lt{background:var(--red)}
.ch{display:flex;align-items:flex-end;gap:4px;height:140px}.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mu)}.ch i{display:block;width:100%;background:linear-gradient(180deg,#e6c25a,#13866a);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:3px}
.sbox{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}.sbox div{border-radius:18px;text-align:center;padding:14px 6px}.sbox b{display:block;font:600 22px "Cormorant Garamond",Georgia,serif;color:var(--ac);word-break:break-word}.sbox div:nth-child(2) b{color:var(--gold)}.sbox span{font-size:10px;color:var(--mu)}
.sec{border-bottom:1px solid var(--bd);padding:16px 0}.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.mg button{text-align:left;border:0;background:none;border-radius:12px;padding:8px;font:inherit;cursor:pointer;color:var(--tx);min-height:52px}.mg button.on{background:rgba(31,162,127,.18)}.mg small{display:block;font-size:11px;color:var(--mu)}.mg span{font-size:12px}
.drop{border:2px dashed var(--ibd);border-radius:18px;padding:22px 12px;text-align:center;cursor:pointer;background:var(--soft);color:var(--ac);font-size:15px}.drop small{display:block;color:var(--mu);font-size:12px;margin-top:4px}.drop.on{border-color:var(--ac);background:var(--oks)}
.hi{padding:12px 0;border-bottom:1px solid var(--bd)}
.sw{display:flex;gap:10px}.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--glassF)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:14px}.seg button{border:0;background:none;border-radius:11px;height:38px;font:600 13px Inter,sans-serif;color:var(--mu);cursor:pointer}.seg button.on{background:var(--glassF);color:var(--ac);box-shadow:var(--glsh)}
.modal{position:fixed;inset:0;background:rgba(10,30,22,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mb{background:var(--glassF);border-radius:24px;padding:20px;max-width:400px;width:100%}.mb h4{margin:0 0 8px;font:600 24px "Cormorant Garamond",Georgia,serif}.mb p{margin:0 0 16px;color:var(--mu);white-space:pre-line}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:rgba(36,26,20,.85);color:#f7e9d8;border:1px solid rgba(255,255,255,.18);padding:10px 16px;border-radius:22px;font-size:14px;z-index:60;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:90%;text-align:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.stat,.greet,.sbox div,nav div{background:var(--glassF)}}
</style>
</head>
<body>
<header class="top"><div><h1>Meus Empréstimos</h1><div class="sub" id="dt"></div></div><div class="tr"><button class="tg" id="tg" data-a="theme" aria-label="Alternar tema claro e escuro"><span class="tgi s">☀️</span><span class="tgi m">🌙</span><span class="thumb"></span></button><button class="av" id="av" data-a="profile" aria-label="Perfil e personalização"></button></div></header>
<section class="greet"><small id="g1"></small><h2 id="g2"></h2><div id="sv"></div></section>
<main id="v"></main>
<nav><div id="nav"></div></nav>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
var $=function(i){return document.getElementById(i)},p2=function(n){return String(n).padStart(2,"0")},r2=function(v){return Math.round(v*100)/100};
var brl=function(n){return(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
var fd=function(s){return s?s.slice(0,10).split("-").reverse().join("/"):""};
var uid=function(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var MN=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function today(){var t=new Date();return t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate())}
function addM(iso,m){var a=iso.split("-").map(Number),t=a[1]-1+m,ny=a[0]+Math.floor(t/12),nm=((t%12)+12)%12,last=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();return ny+"-"+p2(nm+1)+"-"+p2(Math.min(a[2],last))}
function num(s){s=String(s||"").trim();return(s.indexOf(",")>-1?parseFloat(s.replace(/\./g,"").replace(",",".")):parseFloat(s))||0}
function wa(ph,tx){var d=(ph||"").replace(/\D/g,"");if(d&&d.length<=11)d="55"+d;return"https://wa.me/"+d+"?text="+encodeURIComponent(tx)}

/* ===== regras (iguais ao sistema da Lovable) ===== */
function calc(o){var n=Math.max(1,Math.min(12,Math.floor(o.count||1))),rt=(o.rate||0)/100*(o.type==="monthly"?n:1),sc=n>=2?(o.sur||0)/100:0,
 interest=r2(o.principal*rt),surcharge=r2(o.principal*sc),total=r2(o.principal+interest+surcharge),per=Math.floor(total/n*100)/100,am=[];
 for(var i=0;i<n;i++)am.push(i===n-1?r2(total-per*(n-1)):per);return{n:n,interest:interest,surcharge:surcharge,total:total,per:per,amounts:am}}
function build(am,first){return am.map(function(a,i){return{n:i+1,due:addM(first,i),amount:a,paidAt:null}})}
function sumA(a){return r2(a.reduce(function(s,x){return s+x.amount},0))}
function tot(l){var c=calc({principal:l.principal,rate:l.interest_rate,type:l.interest_type,sur:l.surcharge_rate,count:l.installments_count}),t=sumA(l.installments),p=sumA(l.installments.filter(function(i){return i.paidAt}));
 return{interest:c.interest,surcharge:c.surcharge,total:t,paid:p,remaining:r2(t-p),next:l.installments.find(function(i){return!i.paidAt})||null}}
function settled(l){return l.installments.every(function(i){return i.paidAt})}
function overdue(l){var t=today();return l.installments.some(function(i){return!i.paidAt&&i.due<t})}
function mapI(l,f){return Object.assign({},l,{installments:l.installments.map(f)})}
function cn(id){return S.clients.find(function(c){return c.id===id})}
function mergeById(a,b){var m=new Map();a.concat(b).forEach(function(x){m.set(x.id,x)});return Array.from(m.values())}
function delay(p,d){return Math.max(0,Math.round((Date.parse(p.slice(0,10)+"T00:00:00Z")-Date.parse(d.slice(0,10)+"T00:00:00Z"))/864e5))}
function receipts(){var out=[];S.loans.forEach(function(l){
 l.installments.forEach(function(i,k){if(i.paidAt)out.push({id:l.id+":i:"+k,loanId:l.id,clientId:l.client_id,kind:"i",index:k,label:l.installments_count===1?"Pagamento único":"Parcela "+i.n+"/"+l.installments_count,amount:i.amount,paidAt:i.paidAt.slice(0,10),due:i.due,late:delay(i.paidAt,i.due)})});
 l.renewals.forEach(function(r,k){out.push({id:l.id+":r:"+k,loanId:l.id,clientId:l.client_id,kind:"r",index:k,label:"Juros da renovação "+(k+1),amount:r.amount,paidAt:r.date.slice(0,10),due:r.fromDue,late:delay(r.date,r.fromDue)})})});
 return out.sort(function(a,b){return b.paidAt.localeCompare(a.paidAt)||a.id.localeCompare(b.id)})}
